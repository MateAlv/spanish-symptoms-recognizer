name: Deploy to AWS

# A push to main rebuilds the symptom extractor of diagnostic.ar's AWS copy:
# this recognizer inside the gateway of MateAlv/diagnostic.ar-api (its latest
# main, whose services/api-gateway/Dockerfile.recognizer builds the image).
# Both test suites run inside the image, it is pushed to ECR and the copy
# redeploys; if it then fails its health check, the previous image goes back.
# The whole picture is docs/AWS_CICD.md in MateAlv/diagnostic.ar.
#
# Off until the repository secret AWS_DEPLOY_ROLE_ARN exists, so merging this
# file changes nothing by itself. No AWS key is stored here: GitHub signs in
# with OIDC, as a role that only main of this repository can assume.
# DEPLOY_READ_TOKEN reads diagnostic.ar-api, which is private.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  # Secrets cannot be read in a job's `if`, so a first job says whether
  # AWS_DEPLOY_ROLE_ARN is set; without it the deploy is skipped, not failed.
  configured:
    runs-on: ubuntu-latest
    outputs:
      yes: ${{ steps.check.outputs.yes }}
    steps:
      - id: check
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "::notice::AWS_DEPLOY_ROLE_ARN is not set; not deploying."; fi

  deploy:
    needs: configured
    if: needs.configured.outputs.yes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: recognizer

      - uses: actions/checkout@v4
        with:
          repository: MateAlv/diagnostic.ar-api
          ref: main
          token: ${{ secrets.DEPLOY_READ_TOKEN }}
          path: api

      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # The account id is not a credential, but it stays out of the logs: it is
      # in the role ARN and in every ECR image name.
      - name: Mask the AWS account id
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"

      - id: target
        run: |
          set -euo pipefail
          registry=$(aws ssm get-parameter --name /diagnosticar-ci/ECR_REGISTRY --query Parameter.Value --output text)
          api=$(git -C api rev-parse --short=7 HEAD)
          rec=${GITHUB_SHA::7}
          echo "image=$registry/diagnosticar-hpo-recognizer:api-$api-rec-$rec" >> "$GITHUB_OUTPUT"
          echo "tag=api-$api-rec-$rec" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build the extractor
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/services/api-gateway/Dockerfile.recognizer
          build-contexts: recognizer=./recognizer
          load: true
          provenance: false
          tags: ${{ steps.target.outputs.image }}
          cache-from: type=gha,scope=aws-recognizer
          cache-to: type=gha,scope=aws-recognizer,mode=max

      - name: Test inside the image
        run: |
          docker run --rm -e PYTHONPATH=/app/services/api-gateway:/app:/opt/recognizer \
            -w /app/services/api-gateway ${{ steps.target.outputs.image }} \
            python -m pytest tests/ -q -p no:cacheprovider
          docker run --rm -w /opt/recognizer ${{ steps.target.outputs.image }} \
            python -m pytest symptoms_recognizer/tests/ -q -p no:cacheprovider

      - name: Push
        run: docker push --quiet ${{ steps.target.outputs.image }}

      - name: Deploy
        id: deploy
        run: recognizer/.github/scripts/aws-deploy.sh deploy RECOGNIZER_TAG=${{ steps.target.outputs.tag }}

      - name: Health check
        run: recognizer/.github/scripts/aws-deploy.sh check recognizer

      - name: Roll back
        if: failure() && steps.deploy.outcome != 'skipped'
        run: recognizer/.github/scripts/aws-deploy.sh rollback
